name: Platform SDK

on:
  push:
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_sqlite, zip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: PHP unit tests
        run: php backend/tests/run.php

      - name: SDK API diff
        run: php backend/bin/sdk.php api-diff

      - name: Certify demo-kit
        run: php backend/bin/sdk.php certify backend/tests/fixtures/modules/demo-kit

      - name: Certify forms-sdk-reference
        run: php backend/bin/sdk.php certify backend/tests/fixtures/modules/forms-sdk-reference

      - name: Frontend install, unit tests, build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Runtime-node install + test
        working-directory: runtime-node
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Behavior extract + generate + contracts gate
        run: |
          node scripts/behavior/extract-behavior.mjs
          node scripts/behavior/generate-cases.mjs
          BASELINE_REQUIRE_FULL=1 node scripts/contracts/validate-contracts.js

      - name: Behavioral parity PHP ↔ Node (auth probes)
        env:
          # Auth-only gate until package fixture migrations + happy-get deep JSON are green.
          # Happy-get currently fatals PHP (missing package tables) and wedges php -S (INFRA).
          BEHAVIOR_SCENARIOS: unauthenticated,invalid-token
          BEHAVIOR_REQUIRE: auth
          # php -S wedges ~130 keep-alive requests on ubuntu runners; restart each chunk.
          BEHAVIOR_CHUNK: '100'
          BEHAVIOR_PHP_STALL_RETRIES: '5'
        run: |
          node scripts/behavior/run-all.mjs
          test -f tmp/behavior-results/last.json
          node scripts/behavior/module-status.mjs

      - name: Build demo-kit package
        run: node scripts/build-module.js demo-kit --yes

      - name: Build forms-sdk-reference package
        run: node scripts/build-module.js forms-sdk-reference --yes

  lifecycle:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jasefly_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_mysql, zip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure test database
        run: |
          cat > backend/config/config.local.php <<'PHP'
          <?php
          return [
              'app_url' => 'http://localhost',
              'jwt_secret' => 'ci-lifecycle-test-secret-not-for-production',
              'db_driver' => 'mysql',
              'db_host' => '127.0.0.1',
              'db_port' => '3306',
              'db_name' => 'jasefly_test',
              'db_user' => 'root',
              'db_pass' => 'root',
              'db_charset' => 'utf8mb4',
          ];
          PHP

      - name: Apply base schema (001) then incremental migrations
        run: |
          php -r '
          require "backend/src/Bootstrap.php";
          App\Bootstrap::registerAutoload();
          $root = getcwd() . "/backend";
          $db = App\Database::get(require "$root/config/database.php");
          $pdo = $db->pdo();
          $t = new App\Core\Db\SqlTranspiler("mysql");
          $sql = file_get_contents("$root/migrations/001_schema.sql");
          if (str_starts_with($sql, "\xEF\xBB\xBF")) $sql = substr($sql, 3);
          $sql = preg_replace("/^\s*--.*$/m", "", $sql) ?? $sql;
          foreach (preg_split("/;\s*\n/", $sql) ?: [] as $part) {
            $part = trim($part);
            if ($part === "" || str_starts_with($part, "/*")) continue;
            $part = rtrim($part, "; \t\r\n");
            foreach ($t->transpile($part) as $out) { $pdo->exec($out); }
          }
          foreach ($t->drainTriggers() as $tr) { try { $pdo->exec($tr); } catch (Throwable) {} }
          echo "001_schema applied\n";
          '
          php backend/migrate.php

      - name: Lifecycle certification (DB)
        env:
          JASEFLY_LIFECYCLE_DB: '1'
        run: php backend/bin/certify-lifecycle.php
