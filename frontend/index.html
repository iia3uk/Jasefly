<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Inline (not type=module): after deploy a cached shell may point at pruned /assets/*.
      If a script/link fails, force one hard navigation so visitors get the new HTML
      without knowing about Ctrl+F5. Must run before module scripts.
    -->
    <script>
      (function () {
        var KEY = 'jasefly_stale_asset_reload';
        function bust() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          try {
            var u = new URL(location.href);
            u.searchParams.set('_', Date.now().toString(36));
            location.replace(u.toString());
          } catch (e2) {
            location.reload();
          }
        }
        function isAssetUrl(url) {
          if (!url) return false;
          try {
            var path = new URL(url, location.origin).pathname;
            return path.indexOf('/assets/') === 0;
          } catch (e) {
            return /\/assets\//.test(String(url));
          }
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            if (!t || t === window) return;
            var tag = (t.tagName || '').toLowerCase();
            if (tag !== 'script' && tag !== 'link') return;
            var src = t.src || t.href || '';
            if (isAssetUrl(src)) bust();
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          var msg = String(
            (reason && (reason.message || reason)) || reason || '',
          );
          if (
            /Failed to fetch dynamically imported module|Loading chunk|Importing a module script failed|error loading dynamically imported module|MIME type|Expected a JavaScript/i.test(
              msg,
            )
          ) {
            bust();
          }
        });
      })();
    </script>
    <!-- PNG first (transparent + padded). No tall SVG — it letterboxes in tab. -->
    <link rel="icon" type="image/png" href="/favicon.png?v=5" sizes="32x32" />
    <link rel="icon" href="/favicon.ico?v=5" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="generator" content="Jasefly" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="MobileOptimized" content="width" />
    <meta name="theme-color" content="#06080c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Jasefly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
